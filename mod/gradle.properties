org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# 换目标版本就改这几行（scripts\build-all.ps1 会用 -P 覆盖）
minecraft_version=1.21.4
yarn_mappings=1.21.4+build.8
loader_version=0.16.14
fabric_api_version=0.119.4+1.21.4
# 源码覆盖目录：src/compat/<compat>/java（换版本时把有差异的文件放进去）；空 = 不用覆盖
compat=
# 该 target 的 Java 字节码版本（1.21.x → 21；1.20.x / 1.19.x / 1.18.x / 1.17 → 17；1.16.5 → 8）
# fabric.mod.json 里的 minecraft / java 依赖会从 minecraft_version + java_release 自动算，不用手填
java_release=21

mod_version=1.0.0
maven_group=dev.mcver
# 产物文件名：watercraftlauncher-<loaders>-<version>-mc<minecraft>
archives_base_name=watercraftlauncher
mod_loader=fabric
