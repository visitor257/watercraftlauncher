plugins {
    id 'fabric-loom' version '1.9.2'
    id 'java'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// 产物文件名：watercraftlauncher-<loaders>-<version>-mc<minecraft>.jar
// Gradle 默认会把 version 拼在最后，所以要直接指定 archiveFileName
// 注意：sourcesJar / remapSourcesJar 是后面才创建的，必须用 lazy 配置
def artifactName = "${project.archives_base_name}-${project.mod_loader}-${project.version}-mc${project.minecraft_version}"

tasks.matching { it.name == "jar" || it.name == "remapJar" }.configureEach {
    archiveFileName = "${artifactName}.jar"
}
tasks.matching { it.name == "sourcesJar" || it.name == "remapSourcesJar" }.configureEach {
    archiveFileName = "${artifactName}-sources.jar"
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://api.modrinth.com/maven' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

// ---- 多版本支持：src/compat/<compat>/java 里放“整文件覆盖”
// 用法：gradle build -Pcompat=1.21.1 -Pminecraft_version=1.21.1 ...
// 覆盖目录里的同名源码会替代 src/main/java 里的那份，不用维护 N 份完整副本。
def compatName = (project.findProperty("compat") ?: "").toString().trim()
if (!compatName.isEmpty()) {
    def overlayDir = file("src/compat/${compatName}/java")
    if (overlayDir.exists()) {
        def mainJava = file('src/main/java')
        def overridden = fileTree(overlayDir).files.collect { it.absolutePath - (overlayDir.absolutePath + File.separator) }
        sourceSets.main.java.srcDir overlayDir
        sourceSets.main.java.exclude { d -> overridden.contains(d.file.absolutePath - (mainJava.absolutePath + File.separator)) }
        println "[compat] 覆盖 ${overridden.size()} 个文件：${overridden.join(', ')}"
    } else {
        throw new GradleException("找不到兼容层目录：${overlayDir}")
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }

}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    // 例外：OptiFine 驱动必须编成 Java 8 字节码（见下面 compileRunner）
    if (it.name != "compileRunner") it.options.release = 21
}

// ---- OptiFine 驱动 ----
// 1.12.2 / 1.19.4 的 OptiFine 安装器只能跑在「那个年代」的 Java 上，而 mod 本体是
// Java 21 字节码。所以驱动类单独编成 release 8，打成 optifine-runner.jar 放进 jar 资源，
// 运行时解出来用对应 Java 起子进程执行（core/LoaderInstaller#invokeOptifineInstaller）。
def runnerClasses = layout.buildDirectory.dir("runner-classes")

tasks.register("compileRunner", JavaCompile) {
    source = fileTree("runner") { include "**/*.java" }
    classpath = files()
    destinationDirectory = runnerClasses
    options.encoding = "UTF-8"
    options.release = 8
    options.compilerArgs.addAll(["-Xlint:-options", "-nowarn"])
}

tasks.register("runnerJar", Jar) {
    dependsOn "compileRunner"
    archiveFileName = "optifine-runner.jar"
    destinationDirectory = layout.buildDirectory.dir("runner")
    from runnerClasses
}

// processResources 在上面已经声明过了，这里补上资源（必须在 runnerJar 注册之后）
tasks.named("processResources").configure {
    from(tasks.named("runnerJar"))
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    // 里面那份 LICENSE 用短名，别用带版本号的 archivesName
    from("LICENSE") { rename { "${it}_${project.archives_base_name}" } }
}

// 开发时窗口开大一点，方便看 UI 布局
loom {
    runs {
        client {
            programArgs "--width", "1280", "--height", "720"
        }
    }
}
